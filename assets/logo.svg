<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Radial & Linear Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997312" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Golden Ring -->
  <circle cx="120" cy="120" r="112" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Inner Red Circular Field -->
  <circle cx="120" cy="120" r="102" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="120" cy="120" r="97" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- College Name Circular Text Arc -->
  <path id="textArcTop" d="M 32,120 A 88,88 0 0,1 208,120" fill="none"/>
  <text font-family="'Playfair Display', Georgia, serif" font-size="15.5" font-weight="bold" fill="#ffffff" letter-spacing="2.2" text-anchor="middle">
    <textPath href="#textArcTop" startOffset="50%">GYAN INTER COLLEGE</textPath>
  </text>

  <path id="textArcBottom" d="M 206,120 A 86,86 0 0,1 34,120" fill="none"/>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="url(#goldGrad)" letter-spacing="2" text-anchor="middle">
    <textPath href="#textArcBottom" startOffset="50%">SIKANDRA • AGRA • ESTD 1998</textPath>
  </text>

  <!-- Central Shield -->
  <g transform="translate(120, 120)">
    <!-- Shield Outline -->
    <path d="M 0,-42 C 26,-42 42,-34 42,-18 C 42,22 14,46 0,54 C -14,46 -42,22 -42,-18 C -42,-34 -26,-42 0,-42 Z" 
          fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shadow)"/>
    
    <!-- Shield Red Inner Field -->
    <path d="M 0,-38 C 23,-38 38,-30 38,-16 C 38,19 12,41 0,48 C -12,41 -38,19 -38,-16 C -38,-30 -23,-38 0,-38 Z" 
          fill="url(#shieldGrad)"/>

    <!-- Rising Sun / Knowledge Rays -->
    <circle cx="0" cy="-14" r="8" fill="url(#goldGrad)"/>
    <path d="M 0,-26 L 0,-21 M -9,-23 L -6,-19 M 9,-23 L 6,-19 M -13,-14 L -9,-14 M 13,-14 L 9,-14" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Open Book of Wisdom -->
    <g transform="translate(0, 10)">
      <!-- Pages -->
      <path d="M 0,-2 C 8,-8 22,-8 28,-4 L 28,14 C 22,10 8,10 0,14 C -8,10 -22,10 -28,14 L -28,-4 C -22,-8 -8,-8 0,-2 Z" 
            fill="url(#silverGrad)" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <!-- Book spine & Page Lines -->
      <path d="M 0,-2 L 0,14" stroke="#990000" stroke-width="1.5"/>
      <path d="M 5,2 L 23,0 M 5,6 L 23,4 M -5,2 L -23,0 M -5,6 L -23,4" stroke="#990000" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Academic Torch / Flame (Symbol of Gyan / Knowledge) -->
    <path d="M 0,-18 C 4,-24 0,-30 0,-30 C 0,-30 -4,-24 0,-18 Z" fill="#ffd700"/>
    <path d="M 0,-20 C 2,-23 0,-27 0,-27 C 0,-27 -2,-23 0,-20 Z" fill="#ffffff"/>
  </g>

  <!-- Laurel Wreath Leaves on Sides -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <!-- Left Leaves -->
    <circle cx="48" cy="114" r="3.5"/>
    <circle cx="45" cy="126" r="3.5"/>
    <!-- Right Leaves -->
    <circle cx="192" cy="114" r="3.5"/>
    <circle cx="195" cy="126" r="3.5"/>
    <!-- Little Stars -->
    <polygon points="120,44 122,49 127,49 123,52 125,57 120,54 115,57 117,52 113,49 118,49" fill="url(#goldGrad)"/>
  </g>
</svg>